name: Release

# Push a tag like v0.1.1 and this builds the Windows installer and publishes it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
        shell: bash
      - name: Use the tag as the app version
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        shell: bash
      - name: Build
        run: npx electron-vite build
        shell: bash
      - name: Package and publish
        run: npx electron-builder --win --publish always
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
