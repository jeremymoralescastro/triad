appId: dev.you.triad
productName: Triad
directories: { output: dist }
files: ['out/**', 'resources/**', 'package.json']
asarUnpack: ['node_modules/@ghostery/**']   # lets the adblock preload be required from disk
win:
  artifactName: Triad-Setup-${version}.${ext}
  target: [{ target: nsis, arch: [x64] }]
  icon: build/icon.ico
mac:
  category: public.app-category.music
  icon: build/icon.icns
  target: [{ target: dmg, arch: [arm64, x64] }, { target: zip, arch: [arm64, x64] }]
  artifactName: Triad-${version}-mac-${arch}.${ext}
nsis: { oneClick: false, allowToChangeInstallationDirectory: true }
publish:
  provider: github
  owner: jeremymoralescastro
  repo: triad
  releaseType: release
